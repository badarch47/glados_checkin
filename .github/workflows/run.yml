name: run

# 定时说明
# ---------------------------------------------------------------------------
# GitHub Actions 的 cron 用 UTC，且只会「推迟」不会提前。本仓库实测（2026-11）
# 延迟中位数约 +4.6 小时，长尾 +8.2 小时，官方不承诺上限。
#
# 目标有两个，且互相牵制：
#   ① 签到落在 IQI 较低、光缆补偿较高的时段（目前定在北京 19:30 之后）；
#   ② 绝不因延迟跨过北京零点 —— 跨零点会把这次签到算到第二天，
#      等于今天漏签、明天顶掉，净亏一天积分。
#
# 做法：cron 只负责「保证当天能启动」，签到时刻交给脚本内部的窗口守候。
#   下面这条 = UTC 06:20 = 北京 14:20 触发。
#   · 准点触发 → 脚本原地等到北京 19:30 再签（等 5 小时 10 分，仍在单 job 6 小时上限内）
#   · 延迟到北京 22:32 → 已过窗口，立即签
#   · 只要延迟小于 9 小时 40 分，落点就一定还在当天之内（观测最大值 8.2 小时，余量约 1.5 小时）
#   窗口起点可用仓库 Variable `CHECKIN_WINDOW_START`（格式 HH:MM）覆盖，不设置则默认 19:30。
#
# 【重要】不要保留 push 触发器：任何一次 commit/push 都会立刻跑一次签到，
# 这是「签到时间随机」的最主要原因。改由 schedule + 手动 dispatch 触发。
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      force_browser:
        description: '跳过 HTTP 签到，直接走浏览器通道（排障用）'
        type: boolean
        default: false
      browser_click:
        description: '允许模拟点击 Turnstile 复选框'
        type: boolean
        default: false
      browser_headed:
        description: '使用有头浏览器（配合 xvfb）'
        type: boolean
        default: false
  schedule:
    # 两条 cron 互为冗余：GitHub 偶尔会直接丢掉一次 schedule（2026-11-13 就全天没触发，
    # 导致当天漏签且没有任何通知）。第一条被丢时，第二条仍会在当天启动。
    # 两条都设在窗口之前，后一条只在前一条被丢或失败时才真正签到；
    # 前一条正常时后一条排队等它结束，读到「已签到」后直接退出。
    - cron: '20 6 * * *'  # UTC 06:20 = 北京 14:20
    - cron: '20 7 * * *'  # UTC 07:20 = 北京 15:20（最晚落点 23:32，仍不跨零点）

# 同一时间只允许一个签到实例，避免重复签到 / 并发冲突
concurrency:
  group: glados-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # 必须覆盖「等待 + 签到」的总时长，否则窗口守候会被提前掐断。
    # GitHub 单个 job 硬上限就是 6 小时（360 分钟），这里直接拉满。
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci || npm install

      # Turnstile 兜底通道需要真实 Chromium。
      # 装在前面而不是「失败后再装」，是因为安装要 1~2 分钟，
      # 放在等待窗口之后会拖慢签到；这里装的成本可以忽略。
      # --no-save 避免改动 package-lock.json。
      - name: Install browser (optional)
        run: |
          npm i playwright --no-save --no-audit --no-fund
          npx playwright install --with-deps chromium
        continue-on-error: true

      # 签到前先确认协议没变。宽松模式：只打印告警，不阻断签到，
      # 避免误报导致漏签；严重变化由独立的 guard.yml 严格告警。
      - name: Protocol Guard
        run: node guard.js --soft
        continue-on-error: true
        env:
          DOMAIN: ${{ secrets.DOMAIN }}

      - name: Checkin
        # 需要「有头」浏览器时用 xvfb 提供虚拟屏幕（runner 上没有真实显示器）
        run: |
          if [ "${BROWSER_HEADED}" = "1" ]; then
            echo "使用 xvfb 运行有头浏览器"
            xvfb-run -a --server-args="-screen 0 1280x800x24" npm run main
          else
            npm run main
          fi
        env:
          GLADOS: ${{ secrets.GLADOS }}
          GLADOS_UA: ${{ secrets.GLADOS_UA }}
          # 多账号：在仓库 Secrets 里按需新增 GLADOS2 / GLADOS3 / …… 即可，
          # 未配置时值为空字符串，脚本会自动跳过，不影响原有账号。
          GLADOS2: ${{ secrets.GLADOS2 }}
          GLADOS_UA2: ${{ secrets.GLADOS_UA2 }}
          GLADOS2_UA: ${{ secrets.GLADOS2_UA }}
          GLADOS3: ${{ secrets.GLADOS3 }}
          GLADOS_UA3: ${{ secrets.GLADOS_UA3 }}
          GLADOS3_UA: ${{ secrets.GLADOS3_UA }}
          DOMAIN: ${{ secrets.DOMAIN }}
          NOTIFY: ${{ secrets.NOTIFY }}
          AUTO_EXCHANGE: ${{ secrets.AUTO_EXCHANGE }}
          EXCHANGE_THRESHOLD: ${{ secrets.EXCHANGE_THRESHOLD }}
          # 留空则脚本使用默认 19:30
          CHECKIN_WINDOW_START: ${{ vars.CHECKIN_WINDOW_START }}
          # 浏览器通道：HTTP 被 Turnstile 拦截时自动启用
          # FORCE_BROWSER=true 可跳过 HTTP 直接走浏览器（排障用）
          FORCE_BROWSER: ${{ inputs.force_browser }}
          # 需要人工点击复选框时置 1（默认不点，先看能否静默出票）
          BROWSER_CLICK: ${{ inputs.browser_click || vars.BROWSER_CLICK }}
          # 需要「有头」浏览器时置 1（runner 上需配合 xvfb-run）
          BROWSER_HEADED: ${{ inputs.browser_headed && '1' || vars.BROWSER_HEADED }}
